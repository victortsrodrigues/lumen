openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Church ERP API
servers:
  - url: /api
    description: Base API path
tags:
  - name: dashboard
    description: Dashboard KPIs and statistics
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: audit
    description: Audit log operations
  - name: members
    description: Member management
  - name: storage
    description: File storage operations
  - name: finance
    description: Financial management operations
  - name: teaching
    description: Teaching module (courses, lessons, attendance)
  - name: events
    description: Events and calendar management
  - name: lgpd
    description: LGPD data subject rights portal
  - name: media
    description: Media links (videos, external resources)
  - name: ministries
    description: Ministry and department management
  - name: assets
    description: Asset and property management
  - name: schedules
    description: Service roles and volunteer scheduling
  - name: contents
    description: Teaching contents (devotionals, studies, sermon outlines)
  - name: planning
    description: Strategic planning (directives, objectives, initiatives)
  - name: pastoral
    description: Pastoral care and follow-up visits
  - name: counseling
    description: Confidential pastoral counseling cases and sessions
  - name: songs
    description: Song library and suggestions
  - name: cultos
    description: Worship service planning (cultos)
  - name: articles
    description: Articles with approval workflow
  - name: forum
    description: Community forum
  - name: institutional
    description: Institutional pages (CMS)
  - name: pix
    description: PIX donations
  - name: notifications
    description: In-app notifications
  - name: council
    description: Conselho da igreja (atas e reuniões — admin only)
  - name: utils
    description: Utility endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Dashboard KPIs and statistics (admin, leader)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/leader-widgets:
    get:
      operationId: getLeaderWidgets
      tags: [dashboard]
      summary: Personal leader widgets (pastoral, counseling, articles)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderWidgets"

  /dashboard/member-stats:
    get:
      operationId: getMemberStats
      tags: [dashboard]
      summary: Personal dashboard data for members
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberStats"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/mfa/setup:
    post:
      operationId: setupMfa
      tags: [auth]
      summary: Setup MFA for current user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: MFA setup info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetupResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      tags: [auth]
      summary: Verify MFA code
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
      responses:
        "200":
          description: MFA verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [auth]
      summary: Get CSRF token
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"

  /audit/logs:
    get:
      operationId: getAuditLogs
      tags: [audit]
      summary: Get audit logs (Admin only)
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: userId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List members (paginated)
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [visitante, ativo, inativo, falecido]
        - name: familyId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMember
      tags: [members]
      summary: Create a new member
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberRequest"
      responses:
        "201":
          description: Member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /discipleship/summary:
    get:
      operationId: getDiscipleshipSummary
      tags: [discipleship]
      summary: Discipleship 4x3 health matrix (active members only)
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscipleshipSummary"

  /discipleship/at-risk:
    get:
      operationId: getDiscipleshipAtRisk
      tags: [discipleship]
      summary: Members with red health in any area
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: query, name: area, required: false, schema: { $ref: "#/components/schemas/MemberArea" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtRiskResponse"

  /discipleship/leaders:
    get:
      operationId: getDiscipleshipLeaders
      tags: [discipleship]
      summary: Members who are leaders in any area
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscipleshipLeadersResponse"

  /discipleship/by-leader/{leaderId}:
    get:
      operationId: getDiscipleshipByLeader
      tags: [discipleship]
      summary: Members under this leader (group by area)
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: leaderId, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtRiskResponse"

  /discipleship/members/{id}/areas:
    get:
      operationId: getMemberAreas
      tags: [discipleship]
      summary: List 4 discipleship areas for a member
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAreasResponse"

  /discipleship/members/{id}/areas/{area}:
    put:
      operationId: updateMemberArea
      tags: [discipleship]
      summary: Update one discipleship area for a member
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: area, required: true, schema: { $ref: "#/components/schemas/MemberArea" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberAreaRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAreaEntry"

  /discipleship/members/{id}/history:
    get:
      operationId: getMemberAreaHistory
      tags: [discipleship]
      summary: Discipleship area transition history
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAreaHistoryResponse"

  /members/me:
    get:
      operationId: getOwnProfile
      tags: [members]
      summary: Get own member profile
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetail"
    put:
      operationId: updateOwnProfile
      tags: [members]
      summary: Update own profile (email cannot change)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnProfileRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetail"

  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a single member
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateMember
      tags: [members]
      summary: Update a member
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: Member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Delete a member (Admin only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /members/{id}/history:
    get:
      operationId: getMemberHistory
      tags: [members]
      summary: Get member change history
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member history entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberHistoryResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /members/{id}/cpf/reveal:
    post:
      operationId: revealMemberCpf
      tags: [members]
      summary: Reveal full CPF (Admin only, audit logged)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full CPF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealCpfResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /members/{id}/exclusion:
    post:
      operationId: registerMemberExclusion
      tags: [members]
      summary: Register member exclusion (admin only)
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterExclusionRequest"
      responses:
        "200":
          description: Excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetail"

  /members/{id}/exclusion/revert:
    post:
      operationId: revertMemberExclusion
      tags: [members]
      summary: Revert member exclusion (admin only)
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Reverted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetail"

  /members/{id}/exclusion/letter:
    post:
      operationId: saveTransferLetter
      tags: [members]
      summary: Save transfer letter PDF path after upload
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferLetterRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  letterPath: { type: string }

  /members/{id}/children:
    post:
      operationId: addMemberChild
      tags: [members]
      summary: Add child link
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddChildRequest"
      responses:
        "201":
          description: Linked

  /members/{id}/children/{rowId}:
    delete:
      operationId: removeMemberChild
      tags: [members]
      summary: Remove child link by row id
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: rowId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Unlinked

  /members/{memberId}/groups/{groupId}:
    post:
      operationId: linkMemberToGroup
      tags: [members]
      summary: Link member to a group
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: memberId, required: true, schema: { type: string } }
        - { in: path, name: groupId, required: true, schema: { type: string } }
      responses:
        "201":
          description: Linked
    delete:
      operationId: unlinkMemberFromGroup
      tags: [members]
      summary: Unlink member from a group
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: memberId, required: true, schema: { type: string } }
        - { in: path, name: groupId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Unlinked

  /member-groups:
    get:
      operationId: listMemberGroups
      tags: [members]
      summary: List member groups
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberGroupListResponse"
    post:
      operationId: createMemberGroup
      tags: [members]
      summary: Create a member group
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberGroupRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberGroup"

  /member-groups/{id}:
    get:
      operationId: getMemberGroup
      tags: [members]
      summary: Get a member group with members
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberGroupDetail"
    put:
      operationId: updateMemberGroup
      tags: [members]
      summary: Update a member group
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberGroupRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberGroup"
    delete:
      operationId: deleteMemberGroup
      tags: [members]
      summary: Delete a member group
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted

  # ─── VISITORS ────────────────────────────────────────────────────────────
  /visitors:
    get:
      operationId: listVisitors
      tags: [visitors]
      summary: List visitors
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: status, schema: { $ref: "#/components/schemas/VisitorStatus" } }
        - { in: query, name: dateFrom, schema: { type: string } }
        - { in: query, name: dateTo, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
