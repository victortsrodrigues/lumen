components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    CsrfTokenResponse:
      type: object
      properties:
        csrfToken:
          type: string
      required:
        - csrfToken

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
        consentAccepted:
          type: boolean
      required:
        - email
        - password
        - name
        - consentAccepted

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        csrfToken:
          type: string
      required:
        - email
        - password
        - csrfToken

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        csrfToken:
          type: string
      required:
        - email
        - csrfToken

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
        csrfToken:
          type: string
      required:
        - token
        - password
        - csrfToken

    MfaSetupResponse:
      type: object
      properties:
        secret:
          type: string
        qrCodeUrl:
          type: string
        backupCodes:
          type: array
          items:
            type: string
      required:
        - secret
        - qrCodeUrl
        - backupCodes

    MfaVerifyRequest:
      type: object
      properties:
        code:
          type: string
        csrfToken:
          type: string
      required:
        - code
        - csrfToken

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, leader, member]
        mfaEnabled:
          type: boolean
        mfaVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - role
        - mfaEnabled
        - mfaVerified
        - createdAt

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        requiresMfa:
          type: boolean
        message:
          type: string
      required:
        - user
        - requiresMfa

    AuditLog:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        details:
          type: object
        ipAddress:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - action
        - createdAt

    AuditLogListResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - logs
        - total
        - page
        - limit

    MemberStatus:
      type: string
      enum: [ativo, disciplina, rol_apartado, falecido, demitido]

    MemberClassification:
      type: string
      enum: [comungante, nao_comungante]

    MemberReceptionMode:
      type: string
      enum:
        - profissao_fe
        - profissao_fe_batismo
        - carta_transferencia
        - jurisdicao_pedido
        - jurisdicao_ex_officio
        - restauracao
        - batismo_infantil
        - transferencia_menor
        - arrolamento_menor

    MemberMaritalStatus:
      type: string
      enum: [solteiro, casado, viuvo, divorciado, uniao_estavel]

    MemberExclusionReason:
      type: string
      enum:
        - transferencia
        - falecimento
        - exclusao_pedido
        - exclusao_disciplina
        - exclusao_abandono
        - ordenacao_ministerio
        - transferencia_responsaveis
        - profissao_fe_migracao
        - exclusao_abandono_responsaveis

    MemberSummary:
      type: object
      properties:
        id: { type: string }
        fullName: { type: string }
        cpfMasked: { type: string }
        email: { type: string }
        classification:
          $ref: "#/components/schemas/MemberClassification"
        status:
          $ref: "#/components/schemas/MemberStatus"
        receptionMode:
          $ref: "#/components/schemas/MemberReceptionMode"
        photoPath: { type: string }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - fullName
        - cpfMasked
        - status
        - createdAt

    MemberLink:
      type: object
      properties:
        id: { type: string }
        fullName: { type: string }
        isExternal: { type: boolean }
        childMemberId: { type: string, nullable: true }
      required: [id, fullName]

    MemberGroupLink:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
      required: [id, name]

    MemberDetail:
      type: object
      properties:
        id: { type: string }
        fullName: { type: string }
        cpfMasked: { type: string }
        dateOfBirth: { type: string }
        sex: { type: string, enum: [masculino, feminino] }
        phone: { type: string }
        email: { type: string }
        addressZip: { type: string }
        addressStreet: { type: string }
        addressNumber: { type: string }
        addressComplement: { type: string }
        addressNeighborhood: { type: string }
        addressCity: { type: string }
        addressState: { type: string }
        # Eclesiástico
        classification:
          $ref: "#/components/schemas/MemberClassification"
        receptionMode:
          $ref: "#/components/schemas/MemberReceptionMode"
        receptionDate: { type: string }
        conversionYear: { type: integer }
        religiousOrigin: { type: string }
        infantBaptism: { type: boolean }
        infantBaptismChurch: { type: string }
        infantBaptismPastor: { type: string }
        parentsOrGuardians: { type: string }
        # Pessoal
        maritalStatus:
          $ref: "#/components/schemas/MemberMaritalStatus"
        spouseMemberId: { type: string }
        spouseName: { type: string }
        externalSpouseName: { type: string, nullable: true }
        academicEducation: { type: string }
        profession: { type: string }
        # Status / exclusão
        status:
          $ref: "#/components/schemas/MemberStatus"
        exclusionReason:
          $ref: "#/components/schemas/MemberExclusionReason"
        exclusionDate: { type: string }
        exclusionNotes: { type: string }
        exclusionLetterPath: { type: string }
        photoPath: { type: string }
        children:
          type: array
          items:
            $ref: "#/components/schemas/MemberLink"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/MemberGroupLink"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - fullName
        - cpfMasked
        - classification
        - status
        - createdAt
        - updatedAt

    MemberListResponse:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberSummary"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
      required: [members, total, page, limit]

    CreateMemberRequest:
      type: object
      properties:
        fullName: { type: string }
        cpf: { type: string }
        dateOfBirth: { type: string }
        sex: { type: string, enum: [masculino, feminino] }
        phone: { type: string }
        email: { type: string }
        addressZip: { type: string }
        addressStreet: { type: string }
        addressNumber: { type: string }
        addressComplement: { type: string }
        addressNeighborhood: { type: string }
        addressCity: { type: string }
        addressState: { type: string }
        classification:
          $ref: "#/components/schemas/MemberClassification"
        receptionMode:
          $ref: "#/components/schemas/MemberReceptionMode"
        receptionDate: { type: string }
        conversionYear: { type: integer }
        religiousOrigin: { type: string }
        infantBaptism: { type: boolean }
        infantBaptismChurch: { type: string }
        infantBaptismPastor: { type: string }
        parentsOrGuardians: { type: string }
        maritalStatus:
          $ref: "#/components/schemas/MemberMaritalStatus"
        spouseMemberId: { type: string }
        externalSpouseName: { type: string, nullable: true }
        academicEducation: { type: string }
        profession: { type: string }
        status:
          $ref: "#/components/schemas/MemberStatus"
        photoPath: { type: string }
        lgpdConsentAccepted: { type: boolean }
        children:
          type: array
          items:
            type: object
            properties:
              childMemberId: { type: string, nullable: true }
              externalName: { type: string, nullable: true }
      required:
        - fullName
        - lgpdConsentAccepted

    UpdateMemberRequest:
      type: object
      properties:
        fullName: { type: string }
        cpf: { type: string }
        dateOfBirth: { type: string }
        sex: { type: string, enum: [masculino, feminino] }
        phone: { type: string }
        email: { type: string }
        addressZip: { type: string }
        addressStreet: { type: string }
        addressNumber: { type: string }
        addressComplement: { type: string }
        addressNeighborhood: { type: string }
        addressCity: { type: string }
        addressState: { type: string }
        classification:
          $ref: "#/components/schemas/MemberClassification"
        receptionMode:
          $ref: "#/components/schemas/MemberReceptionMode"
        receptionDate: { type: string }
        conversionYear: { type: integer }
        religiousOrigin: { type: string }
        infantBaptism: { type: boolean }
        infantBaptismChurch: { type: string }
        infantBaptismPastor: { type: string }
        parentsOrGuardians: { type: string }
        maritalStatus:
          $ref: "#/components/schemas/MemberMaritalStatus"
        spouseMemberId: { type: string, nullable: true }
        externalSpouseName: { type: string, nullable: true }
        academicEducation: { type: string }
        profession: { type: string }
        status:
          $ref: "#/components/schemas/MemberStatus"
        photoPath: { type: string }

    UpdateOwnProfileRequest:
      type: object
      description: Allowlist no backend — apenas estes campos aceitos no PUT /members/me.
      properties:
        fullName: { type: string }
        dateOfBirth: { type: string }
        sex: { type: string, enum: [masculino, feminino] }
        phone: { type: string }
        addressZip: { type: string }
        addressStreet: { type: string }
        addressNumber: { type: string }
        addressComplement: { type: string }
        addressNeighborhood: { type: string }
        addressCity: { type: string }
        addressState: { type: string }
        photoPath: { type: string }
        maritalStatus:
          $ref: "#/components/schemas/MemberMaritalStatus"
        externalSpouseName: { type: string, nullable: true }
        academicEducation: { type: string }
        profession: { type: string }

    RegisterExclusionRequest:
      type: object
      properties:
        reason:
          $ref: "#/components/schemas/MemberExclusionReason"
        date: { type: string }
        notes: { type: string }
      required: [reason]

    TransferLetterRequest:
      type: object
      properties:
        letterPath: { type: string }
        destinationChurch: { type: string }
        responsiblePastor: { type: string }
        secretary: { type: string }
        notes: { type: string }
      required: [letterPath]

    AddChildRequest:
      type: object
      description: Informe childMemberId (membro existente) OU externalName (não cadastrado).
      properties:
        childMemberId: { type: string }
        externalName: { type: string }

    MemberGroup:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name]

    MemberGroupListResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/MemberGroup"
      required: [groups]

    MemberGroupDetail:
      allOf:
        - $ref: "#/components/schemas/MemberGroup"
        - type: object
          properties:
            members:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  fullName: { type: string }
                  email: { type: string, nullable: true }
                  photoPath: { type: string, nullable: true }
                required: [id, fullName]

    CreateMemberGroupRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
      required: [name]

    UpdateMemberGroupRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }

    # ─── VISITORS ─────────────────────────────────────────────────────────
    VisitorStatus:
      type: string
      enum: [recente, acompanhando, sem_retorno, nao_interessado]

    VisitorSummary:
      type: object
      properties:
        id: { type: string }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        dateOfBirth: { type: string, nullable: true }
        addressCity: { type: string, nullable: true }
        addressState: { type: string, nullable: true }
        howFoundUs: { type: string, nullable: true }
        firstVisitDate: { type: string, nullable: true }
        firstVisitEventId: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/VisitorStatus" }
        assignedToMemberId: { type: string, nullable: true }
        assignedToMemberName: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        totalVisits: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, fullName, status, totalVisits, createdAt]

    VisitorVisit:
      type: object
      properties:
        id: { type: string }
        visitorId: { type: string }
        visitDate: { type: string }
        eventId: { type: string, nullable: true }
        eventTitle: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string }
      required: [id, visitorId, visitDate, createdAt]

    VisitorDetail:
      allOf:
        - $ref: "#/components/schemas/VisitorSummary"
        - type: object
          properties:
            visits:
              type: array
              items:
                $ref: "#/components/schemas/VisitorVisit"
          required: [visits]

    VisitorListResponse:
      type: object
      properties:
        visitors:
          type: array
          items:
            $ref: "#/components/schemas/VisitorSummary"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
      required: [visitors, total, page, limit]

    CreateVisitorRequest:
      type: object
      properties:
        fullName: { type: string }
        phone: { type: string }
        email: { type: string }
        dateOfBirth: { type: string }
        addressCity: { type: string }
        addressState: { type: string }
        howFoundUs: { type: string }
        firstVisitDate: { type: string }
        firstVisitEventId: { type: string }
