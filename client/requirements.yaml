packages:
  "recharts": "For financial dashboard charts (income vs expenses, categories)"
  "xlsx": "For exporting financial reports to Excel"
  "jspdf": "For exporting financial reports to PDF"
  "jspdf-autotable": "For rendering tables inside PDF exports"
  "framer-motion": "For smooth transitions and beautiful entry animations"
  "date-fns": "For date formatting and manipulation"
  "react-hook-form": "For robust form state management"
  "@hookform/resolvers": "For Zod validation integration with react-hook-form"
  "zod": "For strict schema validation on forms"

images:
  - path: "client/public/images/finance-hero.png"
    description: "Abstract geometric background in deep blue and emerald green with subtle glowing light leaks, representing financial growth and stability"
    aspect_ratio: "16:9"

notes:
  - Assuming UI components like Dialog, Input, Select, Button exist in @/components/ui/ or using standard Tailwind HTML equivalents if not found to ensure completeness.
  - Relying on @workspace/api-client-react for all data fetching hooks as generated by Orval.
